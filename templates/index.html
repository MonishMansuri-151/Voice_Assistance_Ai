
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Assistant AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 20px; font-family: Arial, sans-serif; color: #edf2ff;
      background: radial-gradient(circle at top, #20386b, #080d1c 65%);
    }
    .app {
      width: min(700px, 100%); padding: 28px; border-radius: 24px;
      background: #111a2d; border: 1px solid #344361;
      box-shadow: 0 20px 70px #0006;
    }
    h1 { text-align: center; margin: 0 0 8px; }
    .sub, #status { text-align: center; color: #aebcda; }
    #status { min-height: 24px; margin: 18px 0; }
    #messages {
      height: 330px; overflow-y: auto; padding: 14px;
      background: #0b1221; border-radius: 16px;
    }
    .message {
      padding: 12px 15px; margin: 10px 0; border-radius: 14px;
      white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5;
    }
    .user { background: #263f70; margin-left: 12%; }
    .assistant { background: #202b40; margin-right: 12%; }
    .controls { display: flex; justify-content: center; margin: 24px 0 10px; }
    #mic {
      width: 88px; height: 88px; border: 0; border-radius: 50%;
      color: white; font-size: 35px; cursor: pointer;
      background: linear-gradient(135deg, #6e65ff, #00b8ce);
      box-shadow: 0 0 30px #6765ff55;
    }
    #mic.recording { background: #e44c66; animation: pulse 1.2s infinite; }
    #mic:disabled { opacity: .5; cursor: wait; }
    @keyframes pulse { 50% { transform: scale(1.07); } }
    .hint { text-align: center; color: #aebcda; font-size: 13px; }
  </style>
</head>
<body>
  <main class="app">
    <h1>Voice Assistant AI</h1>
    <p class="sub">Talk naturally. Your assistant will reply with voice.</p>

    <div id="messages" aria-live="polite">
      <div class="message assistant">
        Hello! Mic button dabakar mujhse baat karein.
      </div>
    </div>

    <div class="controls">
      <button id="mic" type="button" aria-label="Start or stop recording">🎙️</button>
    </div>
    <p id="status" role="status" aria-live="polite">
      Mic dabakar bolna shuru karein
    </p>
    <p class="hint">Recording band karne ke liye mic dobara dabayein.</p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
